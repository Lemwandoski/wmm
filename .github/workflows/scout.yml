name: Weekly catalogue scout

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 07:17 Nairobi time
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look for new seasons and shows
        run: node scripts/scout.mjs
        env:
          YT_SCOUT_KEY: ${{ secrets.YT_SCOUT_KEY }}
      - name: Save the updated catalogue
        run: |
          git config user.name "Rose Reel scout"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json SCOUT_REPORT.md
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly catalogue update"
            git push
          fi
